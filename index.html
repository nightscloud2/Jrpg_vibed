<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Tribute Grid</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style> 
        body { 
            margin: 0; 
            background: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            touch-action: none; /* Prevents mobile pull-to-refresh & browser scrolling */
            user-select: none;  /* Prevents text selection popups on hold */
            -webkit-user-select: none;
        } 
    </style>
</head>
<body>
<script>
    const config = {
        type: Phaser.AUTO,
        width: 320,
        height: 240,
        zoom: 3,
        pixelArt: true,
        physics: { default: 'arcade', arcade: { gravity: { y: 0 } } },
        scene: { preload: preload, create: create, update: update }
    };

    const game = new Phaser.Game(config);
    let player;
    let cursors;

    // Mobile touch state flags
    let touchLeft = false;
    let touchRight = false;
    let touchUp = false;
    let touchDown = false;

    function preload() {}

    function create() {
        // Enable multi-touch inputs (up to 3 simultaneous touch points)
        this.input.addPointer(2);

        // Generate hero placeholder sprite (16x16 red box)
        const graphic = this.make.graphics({ x: 0, y: 0, add: false });
        graphic.fillStyle(0xff0000, 1);
        graphic.fillRect(0, 0, 16, 16);
        graphic.generateTexture('hero', 16, 16);

        player = this.physics.add.sprite(160, 120, 'hero');
        player.setCollideWorldBounds(true);

        // Keyboard input listener
        cursors = this.input.keyboard.createCursorKeys();

        // Build On-Screen Mobile Virtual Controls
        createVirtualControls(this);
    }

    function createVirtualControls(scene) {
        // Helper function to build interactive UI touch buttons
        function makeBtn(x, y, w, h, label, onPress, onRelease) {
            const btn = scene.add.rectangle(x, y, w, h, 0xffffff, 0.25)
                .setInteractive()
                .setScrollFactor(0)
                .setDepth(100);

            const txt = scene.add.text(x, y, label, { fontSize: '10px', color: '#ffffff' })
                .setOrigin(0.5)
                .setScrollFactor(0)
                .setDepth(101);

            btn.on('pointerdown', () => { btn.setFillStyle(0xffffff, 0.6); onPress(); });
            btn.on('pointerup', () => { btn.setFillStyle(0xffffff, 0.25); onRelease(); });
            btn.on('pointerout', () => { btn.setFillStyle(0xffffff, 0.25); onRelease(); });
        }

        // Virtual D-Pad (Bottom-Left)
        makeBtn(40, 180, 22, 22, '▲', () => touchUp = true, () => touchUp = false);
        makeBtn(40, 220, 22, 22, '▼', () => touchDown = true, () => touchDown = false);
        makeBtn(20, 200, 22, 22, '◄', () => touchLeft = true, () => touchLeft = false);
        makeBtn(60, 200, 22, 22, '►', () => touchRight = true, () => touchRight = false);

        // Virtual Action Button (Bottom-Right - useful for talk/inspect/menu later)
        makeBtn(285, 205, 30, 30, 'A', () => console.log('Action A pressed!'), () => {});
    }

    function update() {
        let velocityX = 0;
        let velocityY = 0;

        // Check Keyboard OR Touch input
        if (cursors.left.isDown || touchLeft) { velocityX = -100; }
        else if (cursors.right.isDown || touchRight) { velocityX = 100; }

        if (cursors.up.isDown || touchUp) { velocityY = -100; }
        else if (cursors.down.isDown || touchDown) { velocityY = 100; }

        player.setVelocity(velocityX, velocityY);
    }
</script>
</body>
</html>
